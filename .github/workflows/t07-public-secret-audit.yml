name: T07 full-history public secret audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-history-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit every reachable Git blob
        run: python3 tools/t07_secret_audit.py
      - name: Compile server source to equivalent CommonJS artifact
        run: |
          mkdir -p /tmp/t07-compiled-audit
          npx --yes esbuild@0.25.12 api/secure-plan.js --bundle --platform=node --format=cjs --target=node22 --outfile=/tmp/t07-compiled-audit/secure-plan.cjs --log-level=error
      - name: Inspect compiled CommonJS bytes for embedded secret values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          import sys
          artifact = Path("/tmp/t07-compiled-audit/secure-plan.cjs")
          compiled = artifact.read_bytes()
          signatures = runpy.run_path("tools/t07_secret_audit.py")["SIGNATURES"]
          matches = [name for name, expression in signatures.items() if expression.search(compiled)]
          print("Independent CommonJS compilation audit")
          print("Compiled bytes:", len(compiled))
          print("Secret signature matches:", len(matches))
          if matches:
              for name in matches:
                  print("FAIL category:", name)
              sys.exit(1)
          print("PASS: no embedded secret-value signatures in independently compiled artifact")
          print("Note: this is a reproducible compilation, not the private Vercel production function binary.")
          PY
