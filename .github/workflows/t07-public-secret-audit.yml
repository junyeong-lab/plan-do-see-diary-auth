name: T07 full-history public secret audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-history-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit every reachable Git blob
        run: python3 tools/t07_secret_audit.py
